name: Ingesta diaria

on:
  schedule:
    # 05:17 UTC (07:17 en París en horario de verano), de lunes a sábado.
    - cron: "17 5 * * 1-6"
  workflow_dispatch:
    inputs:
      source:
        description: "Fuente a descargar (ninguna = solo informe)"
        type: choice
        options: [todas, fred, tiingo, ecb, yahoo, euronext, imf, cftc, derivatives, calendar, news, ninguna]
        default: todas
      backfill:
        description: "Descargar todo el historial desde 2020"
        type: boolean
        default: false
      series:
        description: "IDs internos separados por comas (vacío = todas las de la fuente)"
        required: false
        default: ""
      report:
        description: "Generar y enviar el informe diario al terminar"
        type: boolean
        default: false
      report_dry_run:
        description: "Informe sin enviar (solo guardarlo en daily_reports)"
        type: boolean
        default: false
      scheduled:
        description: "Lanzado por la programación diaria de Supabase (se comporta como la ejecución programada)"
        type: boolean
        default: false

concurrency:
  group: ingest-daily
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Los parámetros del formulario se pasan como variables, nunca dentro del comando.
  INGEST_BACKFILL: ${{ inputs.backfill }}
  INGEST_SERIES: ${{ inputs.series }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false          # si una fuente falla, las demás siguen
      matrix:
        source: [fred, tiingo, ecb, yahoo, euronext, imf, cftc, derivatives, calendar, news]
    steps:
      - name: Comprobar si toca esta fuente
        id: pick
        env:
          WANTED: ${{ inputs.source || 'todas' }}
          SOURCE: ${{ matrix.source }}
        run: |
          if [ "$WANTED" = "todas" ] || [ "$WANTED" = "$SOURCE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.pick.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Descargar ${{ matrix.source }}
        if: steps.pick.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          SOURCE: ${{ matrix.source }}
        run: python "ingest/${SOURCE}_ingest.py"

  report:
    # Tras la ingesta programada (el script no envía en fin de semana) o si se pide a mano.
    needs: ingest
    if: ${{ always() && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Informe diario
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL || 'gpt-5.4-mini' }}
          ANALYSIS_EFFORT: ${{ vars.ANALYSIS_EFFORT || 'medium' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://market-radar-pink.vercel.app' }}
          REPORT_FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled }}
          REPORT_DRY_RUN: ${{ inputs.report_dry_run }}
        run: python report/daily_report.py
