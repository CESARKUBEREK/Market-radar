name: Comprobar fuentes

# Solo manual. Lee de las fuentes candidatas y no escribe en la base de datos.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tiingo
        if: false
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python tools/probe_sources.py tiingo
      - name: Fuentes públicas
        if: false
        run: python tools/probe_sources.py public
      - name: FMI
        if: false
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tools/probe_sources.py imf
      - name: Calendario y noticias
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tools/probe_sources.py events
